<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Professor OI Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: trading-terminal shell — sticky header + ticker tape, left rail nav, dense card grid, replay dock fixed at bottom */
/* Layout: HUD trading terminal — sticky header + ticker, left rail, bracketed data cards on a faint grid; replay dock at bottom.
   Themes: AMOLED dark (pure black) and clean light. */
:root{
  --bg:#000000; --panel:#050505; --panel-2:#0F0F0F; --line:#1C1C1C; --line-2:#2C2C2C;
  --fg:#F2F2EF; --muted:#9C9C97; --faint:#5F5F5A;
  --accent:#4D8DFF; --call:#FF5A5F; --put:#2ED18A; --amber:#F2B233; --on-solid:#000000; --on-amber:#1A1200;
  --ink:#F2F2EF; --ink-fg:#000000; --brk:#4A4A46; --grid:rgba(255,255,255,.035);
  --glow1:#22C3B5; --glow2:#4D8DFF; --glow3:#A58BFF;
  --f-display:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --top:94px; --shadow:none;
  --brackets:linear-gradient(currentColor,currentColor) left top/9px 1.5px no-repeat,linear-gradient(currentColor,currentColor) left top/1.5px 9px no-repeat,linear-gradient(currentColor,currentColor) right top/9px 1.5px no-repeat,linear-gradient(currentColor,currentColor) right top/1.5px 9px no-repeat,linear-gradient(currentColor,currentColor) left bottom/9px 1.5px no-repeat,linear-gradient(currentColor,currentColor) left bottom/1.5px 9px no-repeat,linear-gradient(currentColor,currentColor) right bottom/9px 1.5px no-repeat,linear-gradient(currentColor,currentColor) right bottom/1.5px 9px no-repeat;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F4F1; --panel:#FFFFFF; --panel-2:#F1F2EE; --line:#E2E4DF; --line-2:#CDD1CA;
    --fg:#121412; --muted:#5C615A; --faint:#8D9289;
    --accent:#2F6BE0; --call:#DE454B; --put:#14965F; --amber:#D4950A; --on-solid:#FFFFFF; --on-amber:#FFFFFF;
    --ink:#141614; --ink-fg:#FFFFFF; --brk:#9DA398; --grid:rgba(18,20,18,.045);
    --glow1:#0E9E93; --glow2:#2F6BE0; --glow3:#6B4DE6; --shadow:0 1px 2px rgba(18,20,18,.04);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F4F1; --panel:#FFFFFF; --panel-2:#F1F2EE; --line:#E2E4DF; --line-2:#CDD1CA;
  --fg:#121412; --muted:#5C615A; --faint:#8D9289;
  --accent:#2F6BE0; --call:#DE454B; --put:#14965F; --amber:#D4950A; --on-solid:#FFFFFF; --on-amber:#FFFFFF;
  --ink:#141614; --ink-fg:#FFFFFF; --brk:#9DA398; --grid:rgba(18,20,18,.045);
  --glow1:#0E9E93; --glow2:#2F6BE0; --glow3:#6B4DE6; --shadow:0 1px 2px rgba(18,20,18,.04);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono,td,.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.up{color:var(--put)} .dn{color:var(--call)} .mut{color:var(--muted)} .acc{color:var(--accent)} .amb{color:var(--amber)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:auto auto 1fr}
.top{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;padding:9px 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font:500 10px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.symsw{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.symsw button{padding:5px 10px;border-radius:6px;font:600 12px var(--f-body);color:var(--muted)}
.symsw button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.symsw select{background:transparent;border:0;padding:5px 6px;font:600 12px var(--f-body);color:var(--muted);border-radius:6px}
.symsw select.on{background:var(--panel-2);color:var(--fg)}
.top .grow{flex:1}
.clock{font:500 13px var(--f-mono);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font:700 10.5px var(--f-body);letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.pill.up{color:var(--put);border-color:color-mix(in srgb,var(--put) 45%,transparent);background:color-mix(in srgb,var(--put) 10%,transparent)}
.pill.dn{color:var(--call);border-color:color-mix(in srgb,var(--call) 45%,transparent);background:color-mix(in srgb,var(--call) 10%,transparent)}
.pill.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.pill.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pill.live .dot{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 70%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
.ibtn{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:12.5px;white-space:nowrap}
.ibtn:hover{color:var(--fg);border-color:var(--line-2)}
.ibtn svg{width:15px;height:15px}
kbd{font:500 10.5px var(--f-mono);padding:1px 5px;border:1px solid var(--line-2);border-radius:4px;color:var(--muted)}
.demo{font:700 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);border:1px dashed color-mix(in srgb,var(--amber) 60%,transparent);padding:3px 8px;border-radius:6px;white-space:nowrap}

.tape{grid-column:1/-1;overflow:hidden;border-bottom:1px solid var(--line);background:var(--panel);position:relative}
.tape-track{display:flex;gap:30px;width:max-content;padding:6px 16px;animation:tape 70s linear infinite}
.tape:hover .tape-track{animation-play-state:paused}
@keyframes tape{to{transform:translateX(-50%)}}
.ti{display:flex;gap:8px;font:500 12px var(--f-mono);white-space:nowrap}
.ti b{font-family:var(--f-body);font-weight:700;color:var(--muted);letter-spacing:.03em}

.rail{position:sticky;top:var(--top);align-self:start;max-height:calc(100vh - var(--top) - 70px);overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.rail h6{margin:12px 10px 6px;font:700 10px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500;font-size:13.5px;text-align:left;width:100%}
.nav-i svg{width:17px;height:17px;flex:none}
.nav-i:hover{color:var(--fg);background:color-mix(in srgb,var(--panel-2) 60%,transparent)}
.nav-i[aria-current="page"]{color:var(--fg);background:var(--panel-2)}
.nav-i[aria-current="page"] svg{color:var(--accent)}
.nav-i em{margin-left:auto;font:700 9px var(--f-body);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);padding:1px 5px;border-radius:4px}
main{min-width:0;padding:18px 20px 120px}

/* ---------- page parts ---------- */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.phead h1{margin:0;font:700 26px/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.phead p{margin:5px 0 0;color:var(--muted);max-width:68ch}
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font:700 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card-h .sub{font-size:11.5px;color:var(--faint)}
.card-h .tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card-b{padding:12px 14px}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.seg button{padding:4px 9px;border-radius:6px;font:600 11.5px var(--f-body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.sel{background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;padding:5px 8px;font:600 12px var(--f-body)}
.note{font-size:12px;color:var(--faint);margin:10px 2px 0}
.empty{color:var(--faint);font-size:13px;padding:8px 0}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:12px 14px 8px;display:flex;flex-direction:column;gap:3px}
.kpi .lab{font:700 10.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font:600 22px/1.15 var(--f-mono);letter-spacing:-.02em}
.kpi .sub{font:500 12px var(--f-mono)}
.kpi svg{width:100%;height:34px;margin-top:4px;display:block}

/* flash on change */
.fu{animation:fu .9s ease-out}.fd{animation:fd .9s ease-out}
@keyframes fu{0%{background-color:color-mix(in srgb,var(--put) 38%,transparent)}100%{background-color:transparent}}
@keyframes fd{0%{background-color:color-mix(in srgb,var(--call) 38%,transparent)}100%{background-color:transparent}}
b.v,.fl{border-radius:3px;padding:0 2px}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:12px}
.tbl th{font:700 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 8px;background:var(--panel-2);text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:5px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl td.l,.tbl th.l{text-align:left}.tbl td.c,.tbl th.c{text-align:center}
.tbl tbody tr:hover td{background-color:color-mix(in srgb,var(--panel-2) 70%,transparent)}
.bc{position:relative}
.bc>.bar{position:absolute;top:3px;bottom:3px;right:2px;width:0;border-radius:3px;background:color-mix(in srgb,var(--call) 24%,transparent);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bc.p>.bar{right:auto;left:2px;background:color-mix(in srgb,var(--put) 24%,transparent)}
.bc>span,.bc>b{position:relative}
.bc .pc{display:block;font-size:10px;color:var(--faint)}
.bc b.v{font-weight:500}
td.h1c{background:var(--call)!important;color:var(--on-solid)}
td.h1p{background:var(--put)!important;color:var(--on-solid)}
td.h2{background:var(--amber)!important;color:var(--on-amber)}
td.h1c .pc,td.h1p .pc,td.h2 .pc{color:inherit;opacity:.8}
td.h1c>.bar,td.h1p>.bar,td.h2>.bar{opacity:0}

/* chain */
.chain{min-width:1120px}
.chain th.cg{background:color-mix(in srgb,var(--call) 80%,var(--panel));color:var(--on-solid);text-align:center}
.chain th.pg{background:color-mix(in srgb,var(--put) 80%,var(--panel));color:var(--on-solid);text-align:center}
.chain th.sp,.chain td.sp{text-align:center;background:var(--panel-2)}
.chain th.sp{cursor:pointer}
.chain td.sp b{font-size:13px}
.chain td.sp i{display:block;font-style:normal;font-size:10px;color:var(--faint)}
.chain td .sub{display:block;font-size:10px;color:var(--faint)}
.chain td .sub i{font-style:normal}
.chain tr.itmc td.cs{background:color-mix(in srgb,var(--amber) 6%,transparent)}
.chain tr.itmp td.ps{background:color-mix(in srgb,var(--amber) 6%,transparent)}
.chain tr.atm td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.chain tr.atm td.sp{background:color-mix(in srgb,var(--accent) 28%,var(--panel));color:var(--fg)}
.chain tr.mid td{padding:7px 10px;background:var(--panel-2)!important;border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);font-family:var(--f-body);font-size:11.5px;text-align:center}
.mid-in{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.mid-in .ctr{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;font-family:var(--f-mono);font-size:11.5px}
.mid-in .sh{color:var(--muted);font-size:11px}
.sumbar{display:grid;grid-template-columns:1fr auto 1fr;border-radius:8px;overflow:hidden;margin-bottom:10px;font:500 11.5px var(--f-mono)}
.sumbar>div{display:flex;flex-wrap:wrap;gap:4px 16px;padding:7px 12px;align-items:center}
.sumbar .cs{background:color-mix(in srgb,var(--call) 16%,var(--panel));justify-content:flex-start}
.sumbar .ps{background:color-mix(in srgb,var(--put) 16%,var(--panel));justify-content:flex-end}
.sumbar .tm{background:var(--panel-2);font-weight:700}
.sumbar span b{font-family:var(--f-body);font-size:10px;letter-spacing:.06em;color:var(--muted);margin-right:5px}

/* overview walls */
.wl{display:grid;grid-template-columns:minmax(92px,auto) 1fr minmax(92px,auto);gap:14px;align-items:center;padding:10px 0}
.wl+.wl{border-top:1px solid var(--line)}
.wl .side .k{font:700 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wl .side .lv{font:600 20px var(--f-mono)}
.wl .side .s2{font-size:11.5px;color:var(--faint)}
.wl .side.r{text-align:right}
.trk{position:relative;height:44px}
.trk .ln{position:absolute;left:0;right:0;top:26px;height:8px;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--put) 45%,transparent),color-mix(in srgb,var(--fg) 7%,transparent) 50%,color-mix(in srgb,var(--call) 45%,transparent))}
.trk .mk{position:absolute;top:30px;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 3px var(--panel);transition:left .45s cubic-bezier(.2,.8,.2,1)}
.trk .mt{position:absolute;top:0;left:50%;transform:translateX(-50%);font:600 12px var(--f-mono);white-space:nowrap;transition:left .45s cubic-bezier(.2,.8,.2,1)}
.trk .nm{position:absolute;top:2px;left:0;font:700 10px var(--f-body);letter-spacing:.1em;color:var(--faint)}
.ai{font-size:14.5px;line-height:1.6;margin:0;min-height:7.5em;text-wrap:pretty}
.ai .cur{display:inline-block;width:7px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.meta{font-size:11.5px;color:var(--faint);margin-top:8px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.feed li:first-child{border-top:0}
.feed li .tm{font:500 11.5px var(--f-mono);color:var(--faint);padding-top:1px}
.feed li .tt{font-weight:600}
.feed li .dd{color:var(--muted);font-size:11.5px}
.feed li.new{animation:slidein .5s ease-out}
.feed button.ev{display:contents;text-align:left}
@keyframes slidein{from{opacity:.2;transform:translateY(-6px)}to{opacity:1;transform:none}}
.tone-up .tt{color:var(--put)}.tone-down .tt{color:var(--call)}.tone-warn .tt{color:var(--amber)}.tone-acc .tt{color:var(--accent)}
.wr{display:grid;grid-template-columns:62px 1fr 64px;gap:8px;align-items:center;font:500 12px var(--f-mono);padding:4px 0}
.wr .b{height:8px;border-radius:999px;background:color-mix(in srgb,var(--fg) 7%,transparent);overflow:hidden}
.wr .b i{display:block;height:100%;border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.ring{display:grid;place-items:center;position:relative}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .tr{stroke:color-mix(in srgb,var(--fg) 8%,transparent)}
.ring .fg{stroke-linecap:round;transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1),stroke .4s}
.ring .lbl{position:absolute;text-align:center}
.ring .lbl b{display:block;font:700 34px/1 var(--f-display)}
.ring .lbl span{font:700 9.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.adbar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin:10px 0 6px;background:color-mix(in srgb,var(--fg) 8%,transparent)}
.adbar i{display:block;transition:width .7s}
.mv{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font:500 12px var(--f-mono)}
.mv div{display:flex;justify-content:space-between;gap:8px}
.mv span{font-family:var(--f-body);font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* charts */
.chart{width:100%;min-height:60px;position:relative}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axl{fill:var(--faint);font:500 10.5px var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.cvwrap{position:relative;width:100%}
.cvwrap canvas{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font:500 11.5px/1.5 var(--f-mono);white-space:nowrap;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tip b{font-family:var(--f-body)}

/* structure */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:5px}
.tile{padding:6px 7px;border-radius:6px;font:600 10.5px var(--f-body);letter-spacing:.02em;border:1px solid transparent;transition:background-color .6s}
.tile span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{display:block;font:500 11.5px var(--f-mono);margin-top:1px}
.lvls{display:flex;flex-direction:column}
.lvls div{display:flex;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--line);font-size:13px}
.lvls div:first-child{border-top:0}
.lvls div.atm{background:var(--panel-2);border-radius:6px}
.lvls b{font:600 13px var(--f-mono)}
.hb{display:grid;grid-template-columns:1fr 64px 1fr;gap:6px;align-items:center;font:500 11px var(--f-mono);padding:2px 0}
.hb .c,.hb .p{height:16px;position:relative;border-radius:3px;background:color-mix(in srgb,var(--fg) 4%,transparent);overflow:hidden}
.hb .c i{position:absolute;right:0;top:0;bottom:0;background:var(--call);opacity:.75;transition:width .7s}
.hb .p i{position:absolute;left:0;top:0;bottom:0;background:var(--put);opacity:.75;transition:width .7s}
.hb .k{text-align:center}
.hb.atm .k{color:var(--accent);font-weight:700}
.verdict{font:700 30px/1 var(--f-display);letter-spacing:-.01em}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0}
.kv b{font:600 12.5px var(--f-mono)}
.bigv{font:600 30px/1.1 var(--f-mono);letter-spacing:-.02em}

/* strategy */
.legs td{vertical-align:middle}
.legs select,.legs input{background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:4px 6px;font:500 12px var(--f-mono);width:100%}
.legs input{width:64px}
.bs{padding:4px 9px;border-radius:6px;font:700 11px var(--f-body);letter-spacing:.06em}
.bs.B{background:color-mix(in srgb,var(--put) 18%,transparent);color:var(--put)}
.bs.S{background:color-mix(in srgb,var(--call) 18%,transparent);color:var(--call)}
.x{width:26px;height:26px;border-radius:6px;color:var(--faint)}
.x:hover{color:var(--call);background:var(--panel-2)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat div{padding:10px 12px;background:var(--panel-2);border-radius:8px}
.stat span{display:block;font:700 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{font:600 16px var(--f-mono)}

/* journal */
.tr-row{cursor:pointer}
.tr-row.sel td{background:color-mix(in srgb,var(--accent) 10%,transparent)!important}
.ex{font:700 9.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}

/* alerts */
.rule{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:12px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule b{font-size:13.5px}
.rule p{margin:0;color:var(--muted);font-size:12.5px;grid-column:1}
.sw{position:relative;width:40px;height:22px;border-radius:999px;background:var(--line-2);transition:background .2s;grid-row:1/3;grid-column:2;align-self:center}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--on-solid);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--put)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* blueprint */
.bp p,.bp li{max-width:72ch;line-height:1.6}
.bp .tbl td{white-space:normal}
.bp h2{font:700 18px var(--f-display);margin:0 0 8px}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch}
.flow div{position:relative;padding:12px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel-2);font-size:12.5px}
.flow div b{display:block;font-size:13px;margin-bottom:3px}
.flow div:not(:last-child)::after{content:"→";position:absolute;right:-10px;top:50%;transform:translate(50%,-50%);color:var(--accent);font-weight:700}
.chk{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk input{width:17px;height:17px;accent-color:var(--put)}
.chk span{color:var(--muted);font-size:12.5px;grid-column:2}
.phase{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.phase:first-child{border-top:0}
.phase b{font:700 12px var(--f-body);color:var(--accent)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;align-items:center;gap:12px;padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.play{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-solid);flex:none}
.play svg{width:15px;height:15px}
.scrub{position:relative;flex:1;height:34px;min-width:80px}
.scrub .bg,.scrub .av,.scrub .fl{position:absolute;left:0;top:15px;height:4px;border-radius:999px}
.scrub .bg{right:0;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 7px)}
.scrub .av{background:var(--line-2)}
.scrub .fl{background:var(--accent)}
.scrub .mk{position:absolute;top:8px;width:2px;height:6px;border-radius:1px;transform:translateX(-1px)}
.scrub .hr{position:absolute;top:23px;font:500 9.5px var(--f-mono);color:var(--faint);transform:translateX(-50%)}
.scrub input{position:absolute;inset:0;width:100%;margin:0;opacity:1;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.scrub input::-webkit-slider-runnable-track{height:34px;background:transparent}
.scrub input::-moz-range-track{height:34px;background:transparent}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:10px;border-radius:50%;background:var(--fg);border:3px solid var(--accent)}
.scrub input::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--fg);border:3px solid var(--accent)}
.dock .tlab{font:600 13px var(--f-mono);min-width:64px}
.toasts{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom,0px));right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.3);animation:tin .45s cubic-bezier(.2,.8,.2,1)}
.toast .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:700 14px var(--f-mono)}
.toast.up .ic{background:color-mix(in srgb,var(--put) 20%,transparent);color:var(--put)}
.toast.down .ic{background:color-mix(in srgb,var(--call) 20%,transparent);color:var(--call)}
.toast.warn .ic,.toast.acc .ic{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
.toast b{font-size:12.5px;display:block}
.toast span{font-size:11.5px;color:var(--muted)}
.toast.out{animation:tout .35s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(24px)}}
.cmdk{position:fixed;inset:0;z-index:90;background:rgba(5,8,12,.55);display:grid;place-items:start center;padding:12vh 16px 0}
.cmdk-box{width:min(560px,100%);background:var(--panel);border:1px solid var(--line-2);border-radius:12px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.cmdk-box input{width:100%;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:15px;outline:none}
.cmdk-box ul{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
.cmdk-box li{padding:9px 11px;border-radius:7px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:13.5px}
.cmdk-box li span{color:var(--faint);font-size:11.5px}
.cmdk-box li[aria-selected="true"]{background:var(--panel-2)}
.anim-in{animation:pagein .35s ease-out}
@keyframes pagein{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}

/* theme switch + stock picker */
.thm button{display:grid;place-items:center;min-height:24px;min-width:28px}
.thm svg{width:14px;height:14px;display:block}
.stk{padding:5px 10px;border-radius:6px;font:600 12px var(--f-body);color:var(--muted);white-space:nowrap}
.stk[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.ibtn[aria-pressed="true"]{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 55%,transparent);background:color-mix(in srgb,var(--amber) 9%,var(--panel))}
.picker{position:fixed;z-index:85;top:60px;left:16px;width:min(460px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 22px 60px rgba(0,0,0,.3);overflow:hidden;animation:pagein .2s ease-out}
.picker input{width:100%;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;outline:none;font-size:14px}
.pk-secs{display:flex;gap:4px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.pk-secs button{flex:none;padding:3px 9px;border-radius:999px;border:1px solid var(--line);font:600 11px var(--f-body);color:var(--muted)}
.pk-secs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.picker ul{list-style:none;margin:0;padding:4px;max-height:min(380px,55vh);overflow:auto}
.picker li button{width:100%;display:grid;grid-template-columns:1fr auto 70px;gap:12px;padding:7px 10px;border-radius:7px;text-align:left;font-size:13px;align-items:center}
.picker li button:hover,.picker li button:focus-visible{background:var(--panel-2)}
.picker li small{display:block;font-size:10.5px;color:var(--faint)}
.picker li .mono{font-size:12px;text-align:right}

/* scanner */
.bu{display:inline-block;padding:2px 8px;border-radius:999px;font:700 9.5px/1.5 var(--f-body);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.bu.LB{background:var(--put);color:var(--on-solid)}
.bu.SB{background:var(--call);color:var(--on-solid)}
.bu.SC{color:var(--put);box-shadow:inset 0 0 0 1px var(--put)}
.bu.LU{color:var(--call);box-shadow:inset 0 0 0 1px var(--call)}
.bu.NT{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-2)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font:600 12px var(--f-body);box-shadow:var(--shadow)}
.cat b{font:700 13px var(--f-mono)}
.cat[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.map circle{transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .3s,r .5s;cursor:pointer;stroke:var(--panel);stroke-width:1}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.sec{padding:8px 10px;border-radius:8px;text-align:left;border:1px solid transparent}
.sec b{display:block;font:700 12px var(--f-body)}
.sec span{font:500 11.5px var(--f-mono)}
.sec[aria-pressed="true"]{border-color:var(--fg)}
.thb{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;white-space:nowrap}
.thb:hover{color:var(--fg)}
.srch{background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;padding:5px 9px;font:500 12.5px var(--f-body);width:170px}
.scan tbody tr{cursor:pointer}
.scan thead th{position:sticky;top:0;z-index:1}
.bul{display:grid;grid-template-columns:1fr auto 84px;gap:10px;width:100%;padding:6px 4px;border-top:1px solid var(--line);font:500 12px var(--f-mono);text-align:left}
.bul span{font-family:var(--f-body);font-weight:600}
.bul b{text-align:right;font-weight:500}
.bul:hover{background:var(--panel-2)}

/* paper trading */
.ticket{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font:700 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;font:500 13px var(--f-mono);width:100%;min-width:0}
.field input[readonly]{color:var(--accent);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sidebtn{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sidebtn button{padding:9px;border-radius:8px;font:700 13px var(--f-body);letter-spacing:.06em;border:1px solid var(--line-2);color:var(--muted)}
.sidebtn button[data-v="B"][aria-pressed="true"]{background:var(--put);border-color:var(--put);color:var(--on-solid)}
.sidebtn button[data-v="S"][aria-pressed="true"]{background:var(--call);border-color:var(--call);color:var(--on-solid)}
.place{padding:11px;border-radius:9px;font:700 14px var(--f-body);color:var(--on-solid);background:var(--put);transition:transform .1s}
.place:active{transform:scale(.98)}
.place.S{background:var(--call)}
.place:disabled{opacity:.4;cursor:not-allowed}
.msg{font-size:12px;min-height:1.2em}
.lock{padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--call) 12%,transparent);color:var(--call);font:600 12.5px var(--f-body)}
.meter{height:8px;border-radius:999px;background:color-mix(in srgb,var(--fg) 8%,transparent);overflow:hidden;margin:4px 0 10px}
.meter i{display:block;height:100%;width:0;border-radius:999px;transition:width .5s}
.ob{list-style:none;margin:0;padding:0;max-height:330px;overflow:auto}
.ob li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px;align-items:center}
.ob li:first-child{border-top:0}

/* ---- HUD look ---- */
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
.card{position:relative;border-radius:6px}
.card::before{content:"";position:absolute;inset:-1px;pointer-events:none;color:var(--brk);background:var(--brackets)}
.card-h h3{font:700 10.5px var(--f-mono);letter-spacing:.14em}
.phead h1{font:700 27px/1.15 var(--f-display);letter-spacing:.005em}
.brand{font-family:var(--f-display);font-size:19px;letter-spacing:.01em}
.brand small{font-family:var(--f-mono);letter-spacing:.16em}
.nav-i{font-family:var(--f-body)}
.nav-i[aria-current="page"]{background:var(--ink);color:var(--ink-fg)}
.nav-i[aria-current="page"] svg{color:var(--ink-fg)}
.nav-i[aria-current="page"] em{color:var(--ink-fg);border-color:color-mix(in srgb,var(--ink-fg) 45%,transparent)}
.play{background:var(--ink);color:var(--ink-fg)}
.symsw button[aria-pressed="true"],.stk[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);box-shadow:none}
.pill{font-family:var(--f-mono);letter-spacing:.08em;border-radius:4px}
.kpi .lab,.stat span,.field>span{font-family:var(--f-mono)}
.kpi .val{align-self:flex-start}
.tbl th{font-family:var(--f-mono);letter-spacing:.1em}
.rd{display:inline-block;animation:rdu .45s cubic-bezier(.2,.8,.2,1)}
.rd.d{animation-name:rdd}
@keyframes rdu{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
@keyframes rdd{from{transform:translateY(-60%);opacity:0}to{transform:none;opacity:1}}
.anim-in .card,.anim-in .cat{animation:cardin .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes cardin{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
.chart path.draw{stroke-dasharray:5000;stroke-dashoffset:5000;animation:draw 1.5s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.mini5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.mini5 .mini{min-width:0}
.mini5 .kv b{font-family:var(--f-mono)}
.ivt{padding:7px 8px;border-radius:5px;text-align:left;font:600 10.5px var(--f-mono);border:1px solid var(--line);transition:transform .2s}
.ivt:hover{transform:translateY(-2px);border-color:var(--fg)}
.ivt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ivt b{font:600 12px var(--f-mono)}
.ivt i{font:500 10.5px var(--f-mono);font-style:normal;margin-left:4px}

/* ---- buildup grid ---- */
.gd-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.gd-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.gd-h{display:flex;justify-content:space-between;align-items:baseline;font:700 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;margin:0 2px 8px}
.gd-h.up{color:var(--put)}.gd-h.dn{color:var(--call)}
.gd-mid{position:relative;height:30px;margin:12px 0;display:flex;align-items:center}
.gd-mid::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,var(--put),var(--accent) 50%,var(--call))}
.gd-mid span{position:relative;margin:0 auto;padding:2px 10px;background:var(--bg);font:600 11px var(--f-mono);color:var(--muted);border:1px solid var(--line-2);border-radius:4px}
.tl{display:flex;flex-direction:column;gap:4px;padding:8px 9px 9px;text-align:left;border:1px solid var(--line);border-radius:5px;background:var(--panel);position:relative;min-width:0;cursor:pointer;transition:border-color .2s}
.tl.b{background:linear-gradient(180deg,color-mix(in srgb,var(--put) 8%,var(--panel)),var(--panel) 65%)}
.tl.r{background:linear-gradient(180deg,color-mix(in srgb,var(--call) 8%,var(--panel)),var(--panel) 65%)}
.tl:hover,.tl.on{border-color:var(--fg)}
.tl.hl::before{content:"";position:absolute;inset:-5px;pointer-events:none;color:var(--fg);background:var(--brackets)}
.tl-h{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;min-width:0}
.tl-h>div{min-width:0}
.tl-s{display:block;font:700 14.5px/1.1 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-p{font:600 11.5px var(--f-mono)}
.tl-r{font:600 10px var(--f-mono);color:var(--muted);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;flex:none}
.tl-tag{display:flex;justify-content:space-between;align-items:center;gap:4px;font:700 8.5px var(--f-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.dots{letter-spacing:1px;font-size:8px}
.dots b{color:var(--fg)}.dots u{color:var(--line-2);text-decoration:none}
.tl-prof{position:relative;display:flex;flex-direction:column;gap:1px;margin-top:3px;height:82px}
.tl-prof .rw{flex:1;display:flex;justify-content:space-between;min-height:1px}
.tl-prof .rw i{display:block;height:100%;background:color-mix(in srgb,var(--put) 62%,transparent)}
.tl-prof .rw i+i{background:color-mix(in srgb,var(--call) 52%,transparent)}
.tl-prof .rw.cur i{opacity:1;filter:saturate(1.4)}
.tl-px{position:absolute;right:0;transform:translateY(-50%);font:700 9.5px var(--f-mono);background:var(--ink);color:var(--ink-fg);padding:1px 4px;border-radius:3px;z-index:1}
.tl-ln{position:absolute;left:0;right:0;height:1px;background:var(--fg);opacity:.6}
.tl-vw{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--accent);opacity:.8}
.gd-side{position:sticky;top:calc(var(--top) + 10px)}
.gd-st{margin:0 0 8px;font:700 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pk{display:block;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);margin-bottom:9px;position:relative}
.pk:hover{border-color:var(--fg)}
.pk.b{background:linear-gradient(160deg,color-mix(in srgb,var(--put) 11%,var(--panel)),var(--panel) 55%)}
.pk.r{background:linear-gradient(160deg,color-mix(in srgb,var(--call) 11%,var(--panel)),var(--panel) 55%)}
.pk-h{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center}
.lg{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font:700 10.5px var(--f-mono);color:#fff}
.pk-h b{font:700 18px/1.1 var(--f-display);display:block}
.pk-h small{font-size:10.5px;color:var(--muted)}
.ring2{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--f-mono);border:2px solid currentColor}
.pk-pill{display:inline-block;margin:10px 0 4px;padding:3px 10px;border-radius:4px;font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--on-solid)}
.pk.b .pk-pill{background:var(--put)}.pk.r .pk-pill{background:var(--call)}
.pk-big{font:700 32px/1.05 var(--f-display);letter-spacing:-.01em}
.pk-px{font:500 12px var(--f-mono);color:var(--muted)}
.pk-lv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.pk-lv small{display:block;font:700 9px var(--f-mono);letter-spacing:.12em;color:var(--faint)}
.pk-lv b{font:600 12.5px var(--f-mono)}
.pk-bar{position:relative;height:4px;border-radius:2px;margin-top:9px;background:linear-gradient(90deg,var(--put),var(--line-2) 50%,var(--call))}
.pk-bar i{position:absolute;top:-3px;width:3px;height:10px;border-radius:2px;background:var(--amber);transform:translateX(-50%);transition:left .6s}

function spark(vals, color, zero) {

}

  if (o.xt !== false) for (const [v, l] of (o.xt || TT)) g += `<text class="axl" x="${X(v)}" y="${h - 7}" text-anchor="${v === o.x0 ? 'start' : v === o.x1 ? 'end' : 'middle'}">${l}</text>`;

      `<section class="card"><div class="card-h"><h3>Writing by strike and time</h3><div class="tools"><div class="seg" id="hmMode"><button data-m="net">Net (P−C)</button><button data-m="calls">Calls</button><button data-m="puts">Puts</button><button data-m="oi">Total OI</button></div></div></div>
      <div class="card-b"><div class="cvwrap" id="hmWrap"><canvas id="hmCv"></canvas><div class="tip" id="hmTip" hidden></div></div>
      <div class="legend" id="hmLeg"></div></div></section>
      <p class="note">Kaise padhein: ek hi strike par lagatar gehra hara = wahan puts likhe ja rahe hain (support ban raha). Gehra laal = call writing (resistance). Rang ka badalna = writers ka mann badalna.</p>`;
    $$('#hmMode button').forEach(b => { b.setAttribute('aria-pressed', b.dataset.m === app.heatMode); b.onclick = () => { app.heatMode = b.dataset.m; $$('#hmMode button').forEach(x => x.setAttribute('aria-pressed', x === b)); this.draw(lastCtx); }; });
    const cv = $('#hmCv');

  },
  update(ctx) { if (ctx.minuteChanged || this.dirty) { this.draw(ctx); this.dirty = false; } },
  draw(ctx) {
    const D = this.D, cv = $('#hmCv'), wrap = $('#hmWrap'), dpr = window.devicePixelRatio || 1;
    const W = wrap.clientWidth, K = D.K, ch = W < 600 ? 13 : 16, lw = 54, top = 4, H = K * ch + 30, cols = 75, cw = (W - lw - 6) / cols;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px';
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const cPut = tok('--put'), cCall = tok('--call'), cFg = tok('--fg'), cFaint = tok('--faint'), cLine = tok('--line'), cAcc = tok('--accent');
    const t0 = ctx.t0, mode = app.heatMode, vals = [];
    let mx = 1;
    for (let b = 0; b < cols; b++) {
      const a = b * 5, z = Math.min((b + 1) * 5, t0); if (a >= t0 && b > 0) { vals.push(null); continue; }
      const A = D.snaps[a], Z = D.snaps[Math.max(z, a)], col = [];
      for (let k = 0; k < K; k++) {
        const dc = Z.cOI[k] - A.cOI[k], dp = Z.pOI[k] - A.pOI[k];
        const v = mode === 'net' ? dp - dc : mode === 'calls' ? dc : mode === 'puts' ? dp : Z.cOI[k] + Z.pOI[k];
        col.push({v, dc, dp, oi: Z.cOI[k] + Z.pOI[k]}); mx = Math.max(mx, Math.abs(v));
      }
      vals.push(col);
    }
    this.L = {lw, top, ch, cw, cols, K, vals};
    const y = k => top + (K - 1 - k) * ch;
    g.font = '500 10px ' + tok('--f-mono');
    for (let k = 0; k < K; k++) {
      g.fillStyle = k === D.snaps[t0].atmK ? cAcc : cFaint; g.textAlign = 'right'; g.textBaseline = 'middle';

    }

        const v = col[k].v, a = 0.07 + 0.88 * Math.sqrt(Math.abs(v) / mx);
        const base = mode === 'net' ? (v >= 0 ? cPut : cCall) : mode === 'calls' ? (v >= 0 ? cCall : cFaint) : mode === 'puts' ? (v >= 0 ? cPut : cFaint) : cAcc;

      }

        const z = Math.min((b + 1) * 5, t0), sk = wallK(D, 'S', z), rk = wallK(D, 'R', z);
        g.lineWidth = 1.5; g.strokeStyle = cPut; g.strokeRect(x + 1, y(sk) + 1, cw - 2, ch - 2); g.strokeStyle = cCall; g.strokeRect(x + 1, y(rk) + 1, cw - 2, ch - 2);
      }

    for (let t = 0; t <= t0; t++) { const x = lw + t / 5 * cw; t ? g.lineTo(x, ys(D.spot[t])) : g.moveTo(x, ys(D.spot[t])); }
    g.stroke();
    const lx = lw + t0 / 5 * cw; g.fillStyle = cFg; g.beginPath(); g.arc(lx, ys(D.spot[t0]), 3.5, 0, 7); g.fill();
    g.fillStyle = cFaint; g.textAlign = 'center'; g.textBaseline = 'alphabetic';

    const lg = mode === 'net' ? `<span><i style="background:var(--put)"></i>Put writing zyada</span><span><i style="background:var(--call)"></i>Call writing zyada</span>` : mode === 'oi' ? `<span><i style="background:var(--accent)"></i>Total OI (gehra = zyada)</span>` : `<span><i style="background:var(--${mode === 'calls' ? 'call' : 'put'})"></i>Nayi writing</span><span><i style="background:var(--faint)"></i>Unwinding</span>`;

  },
  hover(e) {

  },
  update(ctx) {

    const b15 = D.snaps[Math.max(0, t0 - 15)], oi15 = ((s.totC + s.totP) / (b15.totC + b15.totP) - 1) * 100, st15 = (now / (b15.cP[k] + b15.pP[k]) - 1) * 100;
    const watch = oi15 < -0.5 && st15 > 1 ? ['Unwinding + premium up', 'warn'] : oi15 > 0.5 && st15 < -1 ? ['Writers adding', 'acc'] : ['Normal', ''];
    $('#stdC').innerHTML = `<div class="verdict" style="font-size:24px">${watch[0]}</div><p class="note" style="margin-top:4px">Chain OI aur straddle 15 minute mein kis taraf chale.</p><div class="kv"><span>Chain OI, 15 min</span><b class="${oi15 >= 0 ? 'up' : 'dn'}">${pct(oi15)}</b></div><div class="kv"><span>Straddle, 15 min</span><b class="${st15 >= 0 ? 'up' : 'dn'}">${pct(st15)}</b></div><div class="kv"><span>Max pain</span><b>${inr(s.maxPain)}</b></div><div class="kv"><span>OI chg calls / puts</span><b>${compact(s.totCc)} / ${compact(s.totPc)}</b></div>`;
    if (ctx.minuteChanged || this.dirty) {
      const all = [...ser, ...vw], mn = Math.min(...all), mx = Math.max(...all), p = (mx - mn) * 0.1 || 1;
      const k0 = D.snaps[0].atmK, s0 = D.snaps[0], ce = [], pe = [], sd = [];
      for (let t = 0; t <= t0; t++) { const q = D.snaps[t]; ce.push(q.cP[k0] / s0.cP[k0] * 100); pe.push(q.pP[k0] / s0.pP[k0] * 100); sd.push((q.cP[k0] + q.pP[k0]) / (s0.cP[k0] + s0.pP[k0]) * 100); }
      const ad = [...ce, ...pe, ...sd], th = (s.cTh[k0] + s.pTh[k0]) / 6.25 * D.c.lot, last = a => a[a.length - 1] - 100;
      $('#dcStat').innerHTML = `<div class="bigv ${last(sd) < 0 ? 'dn' : 'up'}">${pct(last(sd), 1)}</div><p class="note" style="margin:2px 0 10px">${D.strikes[k0]} ${L('straddle since 09:15', 'straddle 09:15 se')}</p><div class="kv"><span>${D.strikes[k0]} CE</span><b class="${last(ce) < 0 ? 'dn' : 'up'}">${pct(last(ce), 1)}</b></div><div class="kv"><span>${D.strikes[k0]} PE</span><b class="${last(pe) < 0 ? 'dn' : 'up'}">${pct(last(pe), 1)}</b></div><div class="kv"><span>${L('Theta per hour · 1 lot straddle', 'Theta har ghante · 1 lot straddle')}</span><b class="dn">₹${inr(Math.abs(th))}</b></div>`;
      svgChart($('#dcCh'), {h: 210, x0: 0, x1: N, y0: Math.min(...ad) - 4, y1: Math.max(...ad) + 4, yf: v => v.toFixed(0) + '%', pl: 44, anim: this.dirty, label: 'Premium decay', series: [{v: ce, c: 'var(--call)', dot: 1}, {v: pe, c: 'var(--put)', dot: 1}, {v: sd, c: 'var(--fg)', dot: 1, w: 2.2}], extra: (X, Y) => `<line x1="${X(0)}" x2="${X(N)}" y1="${Y(100)}" y2="${Y(100)}" style="stroke:var(--line-2);stroke-dasharray:3 3"/>`});

      this.dirty = false;
    }
  },
};

    const atExp = x => priced.reduce((a, L) => a + L.sg * ((L.type === 'CE' ? Math.max(0, x - L.strike) : Math.max(0, L.strike - x)) - L.price), 0);

const TAPE = ['NIFTY', 'BANKNIFTY', 'VIX', 'PCR', 'RELIANCE', 'HDFCBANK', 'ICICIBANK', 'INFY', 'TCS', 'SBIN', 'ITC', 'LT', 'BHARTIARTL', 'AXISBANK'];
$('#tape').innerHTML = [0, 1].map(() => TAPE.map(n => `<span class="ti" data-tk="${n}"><b>${esc(n)}</b><span class="a"></span><span class="b"></span></span>`).join('')).join('');
function updateTape(ctx) {

  for (const x of DN.stocks) if (TAPE.includes(x.s)) vals[x.s] = ['', lerp(x.p[ctx.t0], x.p[t1], a)];
  $$('#tape .ti').forEach(el => { const v = vals[el.dataset.tk]; if (!v) return; setText(el.children[1], v[0]); const b = el.children[2]; if (v[1] != null) { setText(b, pct(v[1])); b.className = 'b ' + (v[1] >= 0 ? 'up' : 'dn'); } });
}
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
function updateChrome(ctx) {

    $('#scMk').innerHTML = evs.map(e => `<span class="mk" style="left:${e.t / N * 100}%;background:var(${e.tone === 'up' ? '--put' : '--call'})" title="${esc(evTitle(e))}"></span>`).join('') + TT.slice(1, -1).map(([t, l]) => `<span class="hr" style="left:${t / N * 100}%">${l}</span>`).join('');

    const nbP = $('#nb-paper'), ps = paperStats(); if (nbP) { setText(nbP, paper.trades ? sgn(ps.day, compact) : ''); nbP.className = 'nb ' + (ps.day >= 0 ? 'up' : 'dn'); }
    const nbF = $('#nb-mflow'); if (nbF) { setText(nbF, '▲' + UL.filter(u => u.pct[ctx.t0] >= 0).length); nbF.className = 'nb up'; }

$('#playBtn').onclick = () => {
  if (app.mode === 'live') { app.mode = 'replay'; app.playing = false; }
  else { app.playing = !app.playing; if (app.playing && app.tf >= app.edge - 0.01) { app.mode = 'live'; } }
  render(true);
};
$('#liveBtn').onclick = () => { app.mode = 'live'; app.tf = app.edge; render(true); };
$('#speedSeg').onclick = e => { const b = e.target.closest('[data-s]'); if (b) { app.speed = +b.dataset.s; render(); } };
$('#scIn').addEventListener('input', e => { app.mode = 'replay'; app.tf = clamp(+e.target.value, 0, app.edge); e.target.value = app.tf; if (app.tf >= app.edge - 0.01) app.mode = 'live'; render(); });

let actx = null;
function beep(tone) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'sine'; o.frequency.value = tone === 'down' ? 440 : tone === 'up' ? 880 : 660;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.15, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.4);
  } catch (e) {}
}
function speak(txt) { try { if (!window.speechSynthesis) return; const u = new SpeechSynthesisUtterance(txt); u.lang = 'en-IN'; u.rate = 1.05; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }
function notify(e) { if (app.sound.beep) beep(e.tone); if (app.sound.voice) speak(evTitle(e).replace('→', 'to')); }
function toast(e) {
  const box = $('#toasts'), el = document.createElement('div');
  el.className = 'toast ' + e.tone; el.innerHTML = `<span class="ic">${evIcon(e)}</span><div><b>${esc(evTitle(e))}</b><span>${tl(e.t)} · ${esc(evDetail(e))}</span></div>`;
  box.prepend(el); while (box.children.length > 3) box.lastChild.remove();
  notify(e);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 6000);
}
function fireToasts(a, b) {
  if (Math.floor(a) === Math.floor(b)) return;
  const syms = ['NIFTY', 'BANKNIFTY']; if (isStock(app.sym)) syms.push(app.sym);
  for (const s of syms) for (const e of getData(s).events) if (e.t > Math.floor(a) && e.t <= Math.floor(b) && app.rules[e.type]) toast(e);
}

const cmdItems = () => [...PAGES.map(p => ({l: p.label, h: 'Page', run: () => go(p.id)})), ...['NIFTY', 'BANKNIFTY', ...UL.map(u => u.s)].map(s => ({l: `${s} option chain`, h: CFG[s] ? CFG[s].name : U[s].sec, run: () => setSymGo(s, 'chain')})),
  {l: 'Jump to live', h: 'Replay', run: () => $('#liveBtn').click()}, {l: 'Replay from 09:15 at 20×', h: 'Replay', run: () => { app.mode = 'replay'; app.tf = 0; app.playing = true; app.speed = 20; render(true); }},
  {l: 'Light theme', h: 'Theme', run: () => { setTheme('light'); MODS[app.page].dirty = true; render(true); }}, {l: 'Dark theme', h: 'Theme', run: () => { setTheme('dark'); MODS[app.page].dirty = true; render(true); }},
  {l: 'Language: English', h: 'Language', run: () => switchLang('en')}, {l: 'Language: Hinglish', h: 'Language', run: () => switchLang('hi')}];
let cmdSel = 0, cmdList = [];
function openCmd() { $('#cmdk').hidden = false; const i = $('#cmdkIn'); i.value = ''; drawCmd(); i.focus(); }
function closeCmd() { $('#cmdk').hidden = true; }
function drawCmd() { const q = $('#cmdkIn').value.toLowerCase().trim(); cmdList = cmdItems().filter(x => !q || (x.l + ' ' + x.h).toLowerCase().includes(q)).slice(0, 60); cmdSel = clamp(cmdSel, 0, Math.max(0, cmdList.length - 1)); $('#cmdkList').innerHTML = cmdList.map((x, i) => `<li role="option" data-i="${i}" aria-selected="${i === cmdSel}">${esc(x.l)}<span>${esc(x.h)}</span></li>`).join('') || '<li>Kuch nahi mila</li>'; }
$('#openK').onclick = openCmd;
$('#cmdkIn').oninput = () => { cmdSel = 0; drawCmd(); };
$('#cmdkIn').onkeydown = e => { if (e.key === 'ArrowDown') { cmdSel++; drawCmd(); e.preventDefault(); } else if (e.key === 'ArrowUp') { cmdSel--; drawCmd(); e.preventDefault(); } else if (e.key === 'Enter' && cmdList[cmdSel]) { closeCmd(); cmdList[cmdSel].run(); } else if (e.key === 'Escape') closeCmd(); };
$('#cmdkList').onclick = e => { const li = e.target.closest('[data-i]'); if (li) { closeCmd(); cmdList[+li.dataset.i].run(); } };
$('#cmdk').onclick = e => { if (e.target.id === 'cmdk') closeCmd(); };
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#cmdk').hidden ? openCmd() : closeCmd(); } else if (e.key === 'Escape') { closeCmd(); closePicker(); } });
function setTheme(m) { THEME = m; const r = document.documentElement; if (m === 'auto') delete r.dataset.theme; else r.dataset.theme = m; try { localStorage.setItem('poi-theme', m); } catch (e) {} $$('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.th === m)); }
$('#themeSeg').onclick = e => { const b = e.target.closest('[data-th]'); if (!b) return; setTheme(b.dataset.th); MODS[app.page].dirty = true; render(true); };

const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
function roll(el, v, txt) {
  if (!el) return;
  const prev = el._s;
  if (prev !== txt) {
    if (prev === undefined || REDUCE || prev.length !== txt.length) el.textContent = txt;
    else { const d = v < (el._v ?? v) ? ' d' : ''; let h = ''; for (let i = 0; i < txt.length; i++) h += txt[i] !== prev[i] ? `<span class="rd${d}">${esc(txt[i])}</span>` : esc(txt[i]); el.innerHTML = h; }
    el._s = txt;
  }
  if (el._v !== undefined && v !== el._v) { el.classList.remove('fu', 'fd'); void el.offsetWidth; el.classList.add(v > el._v ? 'fu' : 'fd'); }
  el._v = v;
}

/* ================= routing + loop ================= */
let lastCtx = null;
function makeCtx(force) {
  const t0 = Math.min(N, Math.floor(app.tf)), cache = {};
  const ctx = {tf: Math.min(app.tf, N), t0, minuteChanged: force || t0 !== app.lastMin, st: sym => cache[sym] || (cache[sym] = state(getData(sym), Math.min(app.tf, N)))};
  app.lastMin = t0; return ctx;
}
function render(force) {
  const ctx = lastCtx = makeCtx(force);
  updateChrome(ctx);
  const m = MODS[app.page]; if (m.update) m.update(ctx);
}
function mount() {
  const v = $('#view'), m = MODS[app.page];
  v.innerHTML = ''; v.onmouseover = v.onmouseout = v.onclick = null; v.classList.remove('anim-in'); void v.offsetWidth; v.classList.add('anim-in');

}

  if (anchor) setTimeout(() => { const el = document.getElementById(anchor); if (!el) return; const c = el.closest('.card') || el; c.scrollIntoView({behavior: REDUCE ? 'auto' : 'smooth', block: 'start'}); c.classList.remove('flashcard'); void c.offsetWidth; c.classList.add('flashcard'); }, 380);
}

const TICK = 400, MIN_MS = 2000;

  if (document.hidden) return;

getData('NIFTY'); getData('BANKNIFTY'); buildUniverse();
